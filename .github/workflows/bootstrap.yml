name: bootstrap

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# https://docs.github.com/en/actions/reference
# https://docs.github.com/en/actions/reference/context-and-expression-syntax-for-github-actions
# https://docs.github.com/en/actions/guides/storing-workflow-data-as-artifacts
# https://github.github.io/actions-cheat-sheet/actions-cheat-sheet.pdf
# https://github.com/actions/checkout
# https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#using-the-cache-action
#
# TODO:
#   - better caching: https://stackoverflow.com/questions/59269850/caching-apt-packages-in-github-actions-workflow
#   - Create a test result branch: `REPO/test-results`.
#   - Commit test outputs to the test result branch.
# https://stackoverflow.com/questions/57921401/push-to-origin-from-github-action/58393457#58393457


# CI Directives
# * [ci skip]: do not run ci
# * [ci nocache]: run ci without caches
# * [ci failfast]: any failure cancels all other jobs


# Possible workflows:
# 1. csource caches
# 1. bootstrap linux-amd64
# 1. bootstrap macos-amd64 and windows-amd64
#


concurrency:
  group: bootstrap
  cancel-in-progress: true

on:
  push:
    branches:
      - pr_github_ci

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - id: linux-amd64
            os: linux
            arch: amd64
            buildHost: ubuntu-latest
            run: |
              . ci/funs.sh && nimBuildCsourcesIfNeeded

          - id: linux-i386
            os: linux
            arch: i386
            buildHost: ubuntu-latest
            container: true
            containerImageTar: docker_linux_i386.tar
            provision: |
              apt-get install -yq git
            run: |
              . ci/funs.sh && nimBuildCsourcesIfNeeded ucpu=i386

          - id: macos-amd64
            os: macos
            arch: amd64
            buildHost: macos-latest
            run: |
              . ci/funs.sh && nimBuildCsourcesIfNeeded

          - id: windows-amd64
            os: windows
            arch: amd64
            buildHost: windows-latest
            run: |
              .\ci\build_autogen.bat

          - id: openbsd-amd64
            os: openbsd
            osVer: '7.1'
            arch: amd64
            buildHost: macos-latest
            vm: true
            provision: |
              sudo pkg_add git gmake
            run: |
              . ci/funs.sh && nimBuildCsourcesIfNeeded

          - id: freebsd-amd64
            os: freebsd
            osVer: '12.2'
            arch: amd64
            buildHost: macos-latest
            vm: true
            provision: |
              sudo pkg install -y git gmake
            run: |
              . ci/funs.sh && nimBuildCsourcesIfNeeded

          - id: netbsd-amd64
            os: netbsd
            osVer: '9.2'
            arch: amd64
            buildHost: ubuntu-latest
            vm: true
            provision: |
              pkg_add git gmake
            run: |
              . ci/funs.sh && nimBuildCsourcesIfNeeded

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - id: set-matrix
        run: echo "::set-output name=matrix::${{ toJSON(matrix) }}"


  cache:
    needs: matrix
    runs-on: ${{ matrix.platform.buildHost }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v3

      - id: cache-csources
        if: "!inputs.nocache"
        uses: actions/cache@v3
        with:
          path: |
            csources
            bin/nim
            bin/nim_csources
            bin/nim_csources_*
          key: csources-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ hashFiles('config/build_config.txt') }}

      - name: Provision (GitHub runner)
        if: "!matrix.platform.container && !matrix.platform.vm"
        run: ${{ matrix.platform.provision }}

      - if: matrix.platform.os != 'windows' && (!matrix.platform.container && !matrix.platform.vm) && (steps.cache-csources.outputs.cache-hit != 'true' || inputs.nocache)
        run: ${{ matrix.platform.run }}

      - name: Build Nim (csources) (Windows)
        if: matrix.platform.os == 'windows' && (steps.cache-csources.outputs.cache-hit != 'true' || inputs.nocache)
        run: ${{ matrix.platform.run }}
        shell: cmd
        # XXX: Special case for Windows because this won't work:
        # shell: ${{ matrix.platform.shell }}

      - name: Build Nim (csources) in container (${{ matrix.platform.id }})
        if: matrix.platform.container && (steps.cache-csources.outputs.cache-hit != 'true' || inputs.nocache)
        uses: ./.github/actions/linux_i386
        with:
          nocache: ${{ inputs.nocache }}
          provision: ${{ matrix.platform.provision }}
          run: ${{ matrix.platform.run }}

      - name: Build Nim (csources) in VM (${{ matrix.platform.id }})
        if: matrix.platform.vm && (steps.cache-csources.outputs.cache-hit != 'true' || inputs.nocache)
        uses: cross-platform-actions/action@v0.6.2
        with:
          operating_system: ${{ matrix.platform.os }}
          version: ${{ matrix.platform.osVer }}
          shell: bash
          run: |
            ${{ matrix.platform.provision }}
            ${{ matrix.platform.run }}


  bootstrap:
    needs: [matrix, cache]
    runs-on: ${{ matrix.platform.buildHost }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v3
