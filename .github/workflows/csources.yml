name: csources

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

concurrency:
  group: csources
  # cancel-in-progress: true

on:
  workflow_call:
    inputs:
      nocache:
        required: true
        default: false
        type: boolean

jobs:
  cache:
    runs-on: ${{ matrix.platform.buildHost }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-amd64
            os: linux
            arch: amd64
            buildHost: ubuntu-latest
            buildCmd: |
              . ci/funs.sh && nimBuildCsourcesIfNeeded

          - os: linux
            arch: i386
            buildHost: ubuntu-latest
            runOnDocker: true
            dockerImage: docker_linux_i386.tar
            buildCmd: |
              . ci/funs.sh && nimBuildCsourcesIfNeeded ucpu=i386

          - os: macos
            arch: amd64
            buildHost: macos-latest
            buildCmd: |
              . ci/funs.sh && nimBuildCsourcesIfNeeded

          - os: windows
            arch: amd64
            buildHost: windows-latest
            buildCmd: |
              .\ci\build_autogen.bat

          - os: openbsd
            osVer: '7.1'
            arch: amd64
            buildHost: macos-latest
            runOnVm: true
            buildCmd: |
              sudo pkg_add git gmake
              . ci/funs.sh && nimBuildCsourcesIfNeeded

          - os: freebsd
            osVer: '12.2'
            arch: amd64
            buildHost: macos-latest
            runOnVm: true
            buildCmd: |
              sudo pkg install -y git gmake
              . ci/funs.sh && nimBuildCsourcesIfNeeded

          - os: netbsd
            osVer: '9.2'
            arch: amd64
            buildHost: ubuntu-latest
            runOnVm: true
            buildCmd: |
              sudo pkg_add git gmake
              . ci/funs.sh && nimBuildCsourcesIfNeeded

    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/delete_caches
        with:
          github_token: ${{ secrets.gh_token }}
        if: matrix.platform.id == 'linux-amd64'

      - id: cache-csources
        if: "!inputs.nocache"
        uses: actions/cache@v3
        with:
          path: |
            csources
            bin/nim_csources*
          key: csources-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ hashFiles('config/build_config.txt') }}

      - id: build_all
        if: matrix.platform.os != 'windows' && (!matrix.platform.runOnDocker && !matrix.platform.runOnVm) && (steps.cache-csources.outputs.cache-hit != 'true' || inputs.nocache)
        run: ${{ matrix.platform.buildCmd }}

      - id: build_all_windows
        name: Build Nim (Windows)
        if: matrix.platform.os == 'windows' && (steps.cache-csources.outputs.cache-hit != 'true' || inputs.nocache)
        run: ${{ matrix.platform.buildCmd }}
        shell: cmd
        # XXX: This special case for Windows is because I can't get this to work:
        # shell: ${{ matrix.platform.shell }}

      - id: build_all_with_docker
        name: Build Nim (${{ matrix.platform.os }})
        if: matrix.platform.runOnDocker && (steps.cache-csources.outputs.cache-hit != 'true' || inputs.nocache)
        uses: ./.github/actions/linux_i386
        with:
          nocache: ${{ inputs.nocache }}
          run: ${{ matrix.platform.buildCmd }}

      - id: build_all_with_vm
        if: matrix.platform.runOnVm && (steps.cache-csources.outputs.cache-hit != 'true' || inputs.nocache)
        uses: cross-platform-actions/action@v0.6.2
        with:
          operating_system: ${{ matrix.platform.os }}
          version: ${{ matrix.platform.osVer }}
          shell: bash
          run: ${{ matrix.platform.buildCmd }}
