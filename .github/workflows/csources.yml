name: csources

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

concurrency:
  group: csources
  # cancel-in-progress: true

on: workflow_call

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        os:
          - name: freebsd
            version: '13'
          - name: openbsd
            version: '7.1'
    steps:
      - uses: actions/checkout@v3

      - name: Test on ${{ matrix.os.name }}
        uses: cross-platform-actions/action@v0.6.2
        env:
          MY_ENV1: MY_ENV1
          MY_ENV2: MY_ENV2
        with:
          environment_variables: MY_ENV1 MY_ENV2
          operating_system: ${{ matrix.os.name }}
          version: ${{ matrix.os.version }}
          shell: bash
          run: |
            uname -a
            echo $SHELL
            pwd
            ls -lah
            whoami
            env | sort
  cache:
    runs-on: ${{ matrix.platform.buildHost }}
    strategy:
      matrix:
        platform:
          - buildHost: ubuntu-latest
            os: linux
            arch: amd64
            buildCmd: sh build_all.sh

          - buildHost: ubuntu-latest
            os: linux
            arch: i386
            buildCmd: |
              docker build -t nim:linux_i386 - < .github/workflows/linux_i386.Dockerfile
              docker run --mount type=bind,src=`pwd`,dst=`pwd` -w `pwd` -t nim:linux_i386 sh build_all.sh ucpu=i386

          - buildHost: macos-latest
            os: macos
            arch: amd64
            buildCmd: sh build_all.sh

          - buildHost: windows-latest
            os: windows
            arch: amd64
            buildCmd: .\build_all.bat
    steps:
      - uses: actions/checkout@v3

      - id: cache
        uses: actions/cache@v3
        with:
          path: |
            csources
            bin/nim_csources*
          key: csources-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ hashFiles('config/build_config.txt') }}

      - id: build_all
        if: steps.cache.outputs.cache-hit != 'true'
        run: ${{ matrix.platform.buildCmd }}
