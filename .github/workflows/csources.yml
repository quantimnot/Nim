name: csources

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

concurrency:
  group: csources
  # cancel-in-progress: true

on: workflow_call

jobs:
  cache-csources:
    runs-on: ${{ matrix.buildHost }}
    strategy:
      matrix:
        buildHost:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v3

      - id: cache-csources
        uses: actions/cache@v3
        with:
          path: |
            csources
            bin/nim_csources*
          key: csources-${{ hashFiles('config/build_config.txt') }}

      - id: build_all_sh
        if: steps.cache-csources.outputs.cache-hit != 'true' && matrix.buildHost != 'windows-latest'
        run: sh build_all.sh

      - id: build_all_bat
        if: (steps.cache-csources.outputs.cache-hit == 'false') && matrix.buildHost == 'windows-latest'
        run: cmd build_all.bat
