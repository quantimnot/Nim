name: csources

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

concurrency:
  group: csources
  # cancel-in-progress: true

on: workflow_call

jobs:
  cache:
    runs-on: ${{ matrix.platform.buildHost }}
    strategy:
      matrix:
        platform:
          - buildHost: ubuntu-latest
            os: linux
            arch: amd64
            runOnBuildHost: true
          - buildHost: ubuntu-latest
            os: linux
            arch: i386
            runOnBuildHost: false
          - buildHost: macos-latest
            os: macos
            arch: amd64
            runOnBuildHost: true
          - buildHost: windows-latest
            os: windows
            arch: amd64
            runOnBuildHost: true
    steps:
      - uses: actions/checkout@v3

      - id: cache
        uses: actions/cache@v3
        with:
          path: |
            csources
            bin/nim_csources*
          key: csources-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ hashFiles('config/build_config.txt') }}

      - id: build_all_sh
        if: matrix.platform.os != 'windows' && steps.cache.outputs.cache-hit != 'true' && matrix.platform.runOnBuildHost == 'true'
        run: sh build_all.sh

      - id: build_all_bat
        if: (matrix.platform.os == 'windows') && (steps.cache.outputs.cache-hit != 'true') && (matrix.platform.runOnBuildHost == 'true')
        run: .\build_all.bat
