# Caches can be deleted by cache `id` using the GitHub API.
#
# ```sh
# hub api repos/$GITHUB_REPOSITORY/actions/caches | jq '.actions_caches[].id' > cache_ids.lst
# while read id
# do hub api -X DELETE repos/$GITHUB_REPOSITORY/actions/caches/$id
# done < cache_ids.lst
# ```

name: csources

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

concurrency:
  group: csources
  # cancel-in-progress: true

on:
  workflow_call:
    inputs:
      nocache:
        required: true
        default: false
        type: boolean

jobs:
  cache:
    runs-on: ${{ matrix.platform.buildHost }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-amd64
            os: linux
            arch: amd64
            buildHost: ubuntu-latest
            buildCmd: |
              . ci/funs.sh && nimBuildCsourcesIfNeeded

          - id: linux-i386
            os: linux
            arch: i386
            buildHost: ubuntu-latest
            container: true
            containerImageTar: docker_linux_i386.tar
            provision: |
              apt-get install -yq git
            buildCmd: |
              . ci/funs.sh && nimBuildCsourcesIfNeeded ucpu=i386

          - id: macos-amd64
            os: macos
            arch: amd64
            buildHost: macos-latest
            buildCmd: |
              . ci/funs.sh && nimBuildCsourcesIfNeeded

          - id: windows-amd64
            os: windows
            arch: amd64
            buildHost: windows-latest
            buildCmd: |
              .\ci\build_autogen.bat

          - id: openbsd-amd64
            os: openbsd
            osVer: '7.1'
            arch: amd64
            buildHost: macos-latest
            vm: true
            provision: |
              sudo pkg_add git gmake
            buildCmd: |
              . ci/funs.sh && nimBuildCsourcesIfNeeded

          - id: freebsd-amd64
            os: freebsd
            osVer: '12.2'
            arch: amd64
            buildHost: macos-latest
            vm: true
            provision: |
              sudo pkg install -y git gmake
            buildCmd: |
              . ci/funs.sh && nimBuildCsourcesIfNeeded

          - id: netbsd-amd64
            os: netbsd
            osVer: '9.2'
            arch: amd64
            buildHost: ubuntu-latest
            vm: true
            provision: |
              sudo pkg_add git gmake
            buildCmd: |
              . ci/funs.sh && nimBuildCsourcesIfNeeded

    steps:
      - uses: actions/checkout@v3

      # - id: docker_linux_i386-cache
      #   if: "!inputs.nocache"
      #   uses: actions/cache@v3
      #   with:
      #     path: |
      #       docker_linux_i386.tar
      #     key: docker_linux_i386-${{ hashFiles('.github/workflows/linux_i386.Dockerfile') }}

      # - if: inputs.nocache || steps.docker_linux_i386-cache.outputs.cache-hit != 'true'
      #   shell: bash
      #   run: |
      #     docker build -t nim:linux_i386 - < .github/workflows/linux_i386.Dockerfile
      #     docker save nim:linux_i386 > docker_linux_i386.tar

      # - run: |
      #     docker load -i docker_linux_i386.tar
      #     docker run --mount type=bind,src=`pwd`,dst=`pwd` -w `pwd` -t nim:linux_i386 <<EOF
      #     ${{ inputs.run }}
      #     exit
      #     EOF
      #   shell: bash

      - id: cache-csources
        if: "!inputs.nocache"
        uses: actions/cache@v3
        with:
          path: |
            csources
            bin/nim_csources*
          key: csources-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ hashFiles('config/build_config.txt') }}

      - name: Provision (GitHub runner)
        if: "!matrix.platform.container && !matrix.platform.vm"
        run: ${{ matrix.platform.provision }}

      - if: matrix.platform.os != 'windows' && (!matrix.platform.container && !matrix.platform.vm) && (steps.cache-csources.outputs.cache-hit != 'true' || inputs.nocache)
        run: ${{ matrix.platform.buildCmd }}

      - name: Build Nim (csources) (Windows)
        if: matrix.platform.os == 'windows' && (steps.cache-csources.outputs.cache-hit != 'true' || inputs.nocache)
        run: ${{ matrix.platform.buildCmd }}
        shell: cmd
        # XXX: Special case for Windows because this won't work:
        # shell: ${{ matrix.platform.shell }}

      - name: Build Nim (csources) in container (${{ matrix.platform.id }})
        if: matrix.platform.container && (steps.cache-csources.outputs.cache-hit != 'true' || inputs.nocache)
        uses: ./.github/actions/linux_i386
        with:
          nocache: ${{ inputs.nocache }}
          run: ${{ matrix.platform.buildCmd }}

      - name: Build Nim (csources) in VM (${{ matrix.platform.id }})
        if: matrix.platform.vm && (steps.cache-csources.outputs.cache-hit != 'true' || inputs.nocache)
        uses: cross-platform-actions/action@v0.6.2
        with:
          operating_system: ${{ matrix.platform.os }}
          version: ${{ matrix.platform.osVer }}
          shell: bash
          run: ${{ matrix.platform.buildCmd }}
