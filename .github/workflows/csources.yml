name: csources

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

concurrency:
  group: csources
  # cancel-in-progress: true

on: workflow_call

jobs:
  cache:
    runs-on: ${{ matrix.platform.buildHost }}
    strategy:
      matrix:
        platform:
          - buildHost: ubuntu-latest
            os: linux
            arch: amd64
            buildCmd: sh build_all.sh

          - buildHost: ubuntu-latest
            os: linux
            arch: i386
            buildCmd: |
              docker image build -o type=local,dest=linux_i386.tar - < .github/workflows/linux_i386.Dockerfile
              docker image load -i linux_i386.tar
              docker run --mount type=bind,src=`pwd`,dst=`pwd` -w `pwd` -t linux_i386 sh build_all.sh

          - buildHost: macos-latest
            os: macos
            arch: amd64
            buildCmd: sh build_all.sh

          - buildHost: windows-latest
            os: windows
            arch: amd64
            buildCmd: .\build_all.bat
    steps:
      - uses: actions/checkout@v3

      - id: cache
        uses: actions/cache@v3
        with:
          path: |
            csources
            bin/nim_csources*
          key: csources-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ hashFiles('config/build_config.txt') }}

      - id: build_all
        if: steps.cache.outputs.cache-hit != 'true'
        run: ${{ matrix.platform.buildCmd }}
